      .b9{animation:grow9 0.85s cubic-bezier(0.34,1.56,0.64,1) 0.53s both;}
@keyframes grow10{0%{height:0px;y:142px}100%{height:4px;y:138px}}
      .b10{animation:grow10 0.85s cubic-bezier(0.34,1.56,0.64,1) 0.59s both;}
@keyframes grow11{0%{height:0px;y:142px}100%{height:4px;y:138px}}
      .b11{animation:grow11 0.85s cubic-bezier(0.34,1.56,0.64,1) 0.65s both;}
