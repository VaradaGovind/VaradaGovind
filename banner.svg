<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260">
  <defs>
    <style>
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
      @keyframes grow1{0%{height:0;y:172}100%{height:40;y:132}}
      @keyframes grow2{0%{height:0;y:172}100%{height:65;y:107}}
      @keyframes grow3{0%{height:0;y:172}100%{height:28;y:144}}
      @keyframes grow4{0%{height:0;y:172}100%{height:78;y:94}}
      @keyframes grow5{0%{height:0;y:172}100%{height:18;y:154}}
      @keyframes grow6{0%{height:0;y:172}100%{height:52;y:120}}
      @keyframes grow7{0%{height:0;y:172}100%{height:68;y:104}}
      @keyframes grow8{0%{height:0;y:172}100%{height:44;y:128}}
      @keyframes grow9{0%{height:0;y:172}100%{height:33;y:139}}
      @keyframes grow10{0%{height:0;y:172}100%{height:58;y:114}}
      @keyframes grow11{0%{height:0;y:172}100%{height:22;y:150}}
      @keyframes grow12{0%{height:0;y:172}100%{height:48;y:124}}
      .b1{animation:grow1 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.05s both}
      .b2{animation:grow2 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.12s both}
      .b3{animation:grow3 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.19s both}
      .b4{animation:grow4 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.26s both}
      .b5{animation:grow5 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.33s both}
      .b6{animation:grow6 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.40s both}
      .b7{animation:grow7 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.47s both}
      .b8{animation:grow8 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.54s both}
      .b9{animation:grow9 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.61s both}
      .b10{animation:grow10 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.68s both}
      .b11{animation:grow11 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.75s both}
      .b12{animation:grow12 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.82s both}
      .cur{animation:pulse 1.2s ease-in-out infinite}
      .lbl{font-family:'Courier New',Courier,monospace;font-size:8.5px;fill:#484f58;letter-spacing:0.5px}
      .cap{font-family:'Courier New',Courier,monospace;font-size:8px;fill:#6e7681;letter-spacing:1.5px}
      .val{font-family:'Courier New',Courier,monospace;font-size:11px;fill:#e6edf3;font-weight:bold}
      .sub{font-family:'Courier New',Courier,monospace;font-size:9px;fill:#6e7681}
      .mono{font-family:'Courier New',Courier,monospace}
    </style>
    <clipPath id="clip"><rect width="860" height="260" rx="16"/></clipPath>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="1"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Card shadow effect via filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background ─────────────────────────────────────────── -->
  <rect width="860" height="260" rx="16" fill="#0d1117"/>
  <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#161b22" stroke-width="0.4"/>
  </pattern>
  <rect width="860" height="260" fill="url(#grid)" clip-path="url(#clip)" opacity="0.6"/>

  <!-- Left accent gradient bar -->
  <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#388bfd"/>
    <stop offset="100%" stop-color="#3fb950"/>
  </linearGradient>
  <rect x="0" y="0" width="3" height="260" fill="url(#accent)"/>

  <!-- ── LEFT COLUMN ─────────────────────────────────────────── -->

  <!-- Identity card -->
  <rect x="18" y="18" width="238" height="80" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="38" class="cap">ENGINEER</text>
  <text x="32" y="62" class="mono" fill="#e6edf3" font-size="20" font-weight="bold" letter-spacing="-0.3">Varada Govind</text>
  <text x="32" y="80" class="mono" fill="#388bfd" font-size="10" letter-spacing="0.3">@VaradaGovind · he/him</text>

  <!-- Stats row — Repos + Stars side by side -->
  <rect x="18" y="108" width="114" height="66" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="126" class="cap">REPOS</text>
  <text x="32" y="154" class="mono" fill="#e6edf3" font-size="26" font-weight="bold">15</text>
  <text x="32" y="168" class="sub">public</text>

  <rect x="142" y="108" width="114" height="66" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="156" y="126" class="cap">STARS</text>
  <text x="156" y="154" class="mono" fill="#f0883e" font-size="26" font-weight="bold">2</text>
  <text x="156" y="168" class="sub">earned</text>

  <!-- WIP card -->
  <rect x="18" y="186" width="238" height="56" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="204" class="cap">CURRENTLY BUILDING</text>
  <!-- Pulsing dot -->
  <circle cx="32" cy="222" r="4.5" fill="#f0883e" opacity="0.25"/>
  <circle cx="32" cy="222" r="2.5" fill="#f0883e"/>
  <text x="44" y="226" class="mono" fill="#f0883e" font-size="11" font-weight="bold">OrionRV</text>
  <text x="104" y="226" class="sub"> — 4-core RV32IM multicore SoC</text>
  <text x="32" y="237" class="sub" fill="#484f58">SystemVerilog · in progress</text>

  <!-- ── MIDDLE COLUMN ───────────────────────────────────────── -->
  <rect x="270" y="18" width="282" height="224" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>

  <!-- Header -->
  <text x="284" y="38" class="cap">COMMIT ACTIVITY</text>
  <circle cx="430" cy="33" r="4" fill="#3fb950"/>
  <text x="438" y="37" class="mono" fill="#3fb950" font-size="9" font-weight="bold">142 this year</text>

  <!-- Horizontal guide lines -->
  <line x1="300" y1="105" x2="536" y2="105" stroke="#1c2128" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="300" y1="138" x2="536" y2="138" stroke="#1c2128" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="300" y1="172" x2="536" y2="172" stroke="#21262d" stroke-width="0.8"/>

  <!-- Y-axis ticks -->
  <text x="284" y="108" class="lbl">hi</text>
  <text x="284" y="141" class="lbl">md</text>
  <text x="284" y="174" class="lbl">lo</text>

  <!-- Bars with spring animation -->
  <rect class="b1"  x="302" width="15" y="132" height="40" rx="3" fill="url(#gb)"/>
  <rect class="b2"  x="321" width="15" y="107" height="65" rx="3" fill="url(#gb)"/>
  <rect class="b3"  x="340" width="15" y="144" height="28" rx="3" fill="url(#gb)"/>
  <rect class="b4"  x="359" width="15" y="094" height="78" rx="3" fill="url(#gb)"/>
  <rect class="b5"  x="378" width="15" y="154" height="18" rx="3" fill="url(#gb)"/>
  <rect class="b6"  x="397" width="15" y="120" height="52" rx="3" fill="url(#gb)"/>
  <rect class="b7"  x="416" width="15" y="104" height="68" rx="3" fill="url(#gg)"/>
  <rect class="b8"  x="435" width="15" y="128" height="44" rx="3" fill="url(#gg)"/>
  <rect class="b9"  x="454" width="15" y="139" height="33" rx="3" fill="url(#gg)"/>
  <rect class="b10" x="473" width="15" y="114" height="58" rx="3" fill="url(#gg)"/>
  <rect class="b11" x="492" width="15" y="150" height="22" rx="3" fill="url(#gg)"/>
  <rect class="b12" x="511" width="15" y="124" height="48" rx="3" fill="url(#gg)"/>

  <!-- Month labels -->
  <text x="304" y="185" class="lbl">M</text><text x="323" y="185" class="lbl">A</text>
  <text x="342" y="185" class="lbl">M</text><text x="361" y="185" class="lbl">J</text>
  <text x="380" y="185" class="lbl">J</text><text x="399" y="185" class="lbl">A</text>
  <text x="418" y="185" class="lbl">S</text><text x="437" y="185" class="lbl">O</text>
  <text x="456" y="185" class="lbl">N</text><text x="475" y="185" class="lbl">D</text>
  <text x="494" y="185" class="lbl">J</text><text x="513" y="185" class="lbl">F</text>

  <!-- Stats footer -->
  <line x1="284" y1="198" x2="536" y2="198" stroke="#21262d" stroke-width="0.8"/>
  <text x="284" y="213" class="sub">streak</text>
  <text x="324" y="213" class="mono" fill="#388bfd" font-size="10" font-weight="bold">14 days</text>
  <text x="392" y="213" class="sub">total</text>
  <text x="420" y="213" class="mono" fill="#e6edf3" font-size="10" font-weight="bold">142</text>
  <text x="284" y="230" class="sub" fill="#484f58">updated 16 Mar 2026</text>

  <!-- ── RIGHT COLUMN ────────────────────────────────────────── -->
  <rect x="566" y="18" width="276" height="224" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="580" y="38" class="cap">TOP PROJECTS</text>
  <line x1="580" y1="46" x2="826" y2="46" stroke="#21262d" stroke-width="0.8"/>

  <!-- Project 1 — OrionRV -->
  <rect x="580" y="56" width="28" height="28" rx="6" fill="#f0883e" opacity="0.12"/>
  <text x="587" y="75" class="mono" fill="#f0883e" font-size="13">⬡</text>
  <text x="616" y="68" class="val">OrionRV</text>
  <text x="616" y="80" class="sub">4-core RV32IM SoC</text>
  <circle cx="828" cy="69" r="4" fill="#f0883e"/>
  <line x1="580" y1="94" x2="826" y2="94" stroke="#1c2128" stroke-width="0.6"/>

  <!-- Project 2 — rtl-riscv32 -->
  <rect x="580" y="102" width="28" height="28" rx="6" fill="#388bfd" opacity="0.12"/>
  <text x="585" y="121" class="mono" fill="#388bfd" font-size="14">⚡</text>
  <text x="616" y="114" class="val">rtl-riscv32</text>
  <text x="616" y="126" class="sub">single-cycle RV32I processor</text>
  <circle cx="828" cy="115" r="4" fill="#3fb950"/>
  <line x1="580" y1="140" x2="826" y2="140" stroke="#1c2128" stroke-width="0.6"/>

  <!-- Project 3 — CMOS -->
  <rect x="580" y="148" width="28" height="28" rx="6" fill="#d2a8ff" opacity="0.12"/>
  <text x="585" y="167" class="mono" fill="#d2a8ff" font-size="13">⬟</text>
  <text x="616" y="160" class="val">CMOS-Std-Cell-Lib</text>
  <text x="616" y="172" class="sub">transistor-level primitives</text>
  <circle cx="828" cy="161" r="4" fill="#3fb950"/>
  <line x1="580" y1="186" x2="826" y2="186" stroke="#1c2128" stroke-width="0.6"/>

  <!-- Project 4 — SPI -->
  <rect x="580" y="194" width="28" height="28" rx="6" fill="#7ee787" opacity="0.12"/>
  <text x="585" y="213" class="mono" fill="#7ee787" font-size="13">⇄</text>
  <text x="616" y="206" class="val">rtl-spi-controller</text>
  <text x="616" y="218" class="sub">full-duplex SPI master/slave</text>
  <circle cx="828" cy="207" r="4" fill="#3fb950"/>

  <!-- Footer bar -->
  <line x1="580" y1="232" x2="826" y2="232" stroke="#21262d" stroke-width="0.8"/>
  <rect x="580" y="239" width="5" height="9" rx="1" fill="#388bfd" class="cur"/>
  <text x="590" y="247" class="sub" fill="#484f58">15 repos · Verilog · SystemVerilog · C++</text>
</svg>
