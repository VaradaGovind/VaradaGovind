  </g>
</svg>"""

          with open("banner.svg", "w", encoding="utf-8") as f:
            f.write(svg)
          print(f"Done — {total} contributions, {streak} day streak, {stars} stars")
          EOF

      - name: Commit updated banner.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banner.svg
          git diff --staged --quiet || git commit -m "chore: update banner.svg [skip ci]"
          git push

