name: Generate Banner SVG

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub stats & generate banner.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: VaradaGovind
        run: |
          python3 - << 'EOF'
          import urllib.request, json, os, datetime

          token    = os.environ["GITHUB_TOKEN"]
          username = os.environ["USERNAME"]
          headers  = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          # ── User profile ────────────────────────────────────────
          req  = urllib.request.Request(f"https://api.github.com/users/{username}", headers=headers)
          user = json.loads(urllib.request.urlopen(req).read())
          repos_count = user.get("public_repos", 0)

          # ── Stars ───────────────────────────────────────────────
          req   = urllib.request.Request(f"https://api.github.com/users/{username}/repos?per_page=100", headers=headers)
          repos = json.loads(urllib.request.urlopen(req).read())
          stars = sum(r.get("stargazers_count", 0) for r in repos)

          # ── Contributions via GraphQL ───────────────────────────
          now   = datetime.datetime.utcnow()
          start = (now - datetime.timedelta(days=365)).strftime("%Y-%m-%dT00:00:00Z")
          end   = now.strftime("%Y-%m-%dT23:59:59Z")
          query = json.dumps({"query": f"""
          {{
            user(login: "{username}") {{
              contributionsCollection(from: "{start}", to: "{end}") {{
                contributionCalendar {{
                  totalContributions
                  weeks {{
                    contributionDays {{
                      contributionCount
                      date
                    }}
                  }}
                }}
              }}
            }}
          }}
          """})
          
          gql_req  = urllib.request.Request("https://api.github.com/graphql",
              data=query.encode(), headers={**headers, "Content-Type": "application/json"})
          gql_data = json.loads(urllib.request.urlopen(gql_req).read())
          cal      = gql_data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          total    = cal["totalContributions"]

          # ── Monthly buckets ─────────────────────────────────────
          monthly = {}
          all_days = []
          for week in cal["weeks"]:
            for day in week["contributionDays"]:
              m = day["date"][:7]
              monthly[m] = monthly.get(m, 0) + day["contributionCount"]
              all_days.append((day["date"], day["contributionCount"]))

          sorted_months = sorted(monthly.keys())[-12:]
          counts  = [monthly.get(m, 0) for m in sorted_months]
          abbr    = {"01":"J","02":"F","03":"M","04":"A","05":"M","06":"J",
                     "07":"J","08":"A","09":"S","10":"O","11":"N","12":"D"}
          labels  = [abbr.get(m[5:], "?") for m in sorted_months]
          max_c   = max(counts) if max(counts) > 0 else 1
          
          BAR_H   = 70
          BASELINE= 161
          bar_x   = [288 + i * 18 for i in range(12)]

          # ── Streak ──────────────────────────────────────────────
          all_days.sort(reverse=True)
          streak = 0
          for _, c in all_days:
            if c > 0: streak += 1
            else: break

          # ── Build animation keyframes ───────────────────────────
          bar_anims = ""
          for i, cnt in enumerate(counts):
            h = max(4, int(cnt / max_c * BAR_H))
            y_end = BASELINE - h
            bar_anims += f"@keyframes grow{i+1}{{0%{{height:0px;y:{BASELINE}px}}100%{{height:{h}px;y:{y_end}px}}}}\n"
            bar_anims += f"          .b{i+1}{{animation:grow{i+1} 0.9s cubic-bezier(0.34,1.56,0.64,1) {0.05+i*0.07:.2f}s both}}\n"

          # ── Build bar + label elements ──────────────────────────
          bar_els = ""
          lbl_els = ""
          for i, (cnt, lx, lbl) in enumerate(zip(counts, bar_x, labels)):
            h   = max(4, int(cnt / max_c * BAR_H))
            y   = BASELINE - h
            col = "url(#bg2)" if i >= 6 else "url(#bg1)"
            bar_els += f'          <rect class="b{i+1}" x="{lx}" width="13" y="{y}" height="{h}" rx="3" fill="{col}" opacity="0.9"/>\n'
            lbl_els += f'          <text x="{lx+1}" y="178" class="mono" fill="#484f58" font-size="7.5">{lbl}</text>\n'

          updated = now.strftime("%d %b %Y")

          svg = f"""<?xml version="1.0" encoding="utf-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240">
            <defs>
              <style>
                @keyframes pulse {{ 0%, 100% {{ opacity: 1; }} 50% {{ opacity: 0.3; }} }}
                @keyframes pulseNebula {{ 0%, 100% {{ opacity: 0.5; }} 50% {{ opacity: 1; }} }}
                @keyframes float {{ 0%, 100% {{ transform: translateY(0px); }} 50% {{ transform: translateY(-2.5px); }} }}
                .cur {{ animation: pulse 1.1s ease-in-out infinite; }}
                .mono {{ font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }}
                .nebula-pulse {{ animation: pulseNebula 8s infinite ease-in-out; }}
                .float1 {{ animation: float 4s ease-in-out infinite; }}
                .float2 {{ animation: float 4.2s ease-in-out infinite 1s; }}
                .float3 {{ animation: float 3.8s ease-in-out infinite 2s; }}
                .icon-glow {{ filter: url(#glow); }}
                {bar_anims}
              </style>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <clipPath id="clip">
                <rect width="820" height="240" rx="14"/>
              </clipPath>
              <radialGradient id="nebula" cx="50%" cy="50%" r="70%">
                <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.15"/>
                <stop offset="50%" stop-color="#3fb950" stop-opacity="0.05"/>
                <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#388bfd"/>
                <stop offset="100%" stop-color="#1f6feb"/>
              </linearGradient>
              <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3fb950"/>
                <stop offset="100%" stop-color="#238636"/>
              </linearGradient>
              <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#484f58" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#21262d" stop-opacity="0.1"/>
              </linearGradient>
            </defs>

            <rect width="820" height="240" rx="14" fill="#0d1117"/>
            <rect width="820" height="240" rx="14" fill="url(#nebula)" class="nebula-pulse"/>
            
            <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
              <circle cx="1" cy="1" r="0.7" fill="#8b949e" opacity="0.3"/>
            </pattern>
            <rect width="820" height="240" fill="url(#dots)" clip-path="url(#clip)"/>
            <rect x="0" y="0" width="3" height="240" fill="#388bfd" rx="2" class="icon-glow"/>

            <rect x="16" y="16" width="230" height="72" rx="8" fill="#161b22" fill-opacity="0.65" stroke="url(#cardBorder)" stroke-width="1"/>
            <text x="28" y="36" class="mono" fill="#8b949e" font-size="9" letter-spacing="1">ENGINEER</text>
            <text x="28" y="56" class="mono" fill="#e6edf3" font-size="18" font-weight="bold">Varada Govind</text>
            <text x="28" y="72" class="mono" fill="#388bfd" font-size="10">@VaradaGovind · he/him</text>

            <rect x="16" y="96" width="110" height="60" rx="8" fill="#161b22" fill-opacity="0.65" stroke="url(#cardBorder)" stroke-width="1"/>
            <text x="28" y="114" class="mono" fill="#8b949e" font-size="9" letter-spacing="1">REPOS</text>
            <text x="28" y="140" class="mono" fill="#e6edf3" font-size="22" font-weight="bold">{repos_count}</text>
            <text x="28" y="152" class="mono" fill="#6e7681" font-size="9">public</text>

            <rect x="134" y="96" width="112" height="60" rx="8" fill="#161b22" fill-opacity="0.65" stroke="url(#cardBorder)" stroke-width="1"/>
            <text x="146" y="114" class="mono" fill="#8b949e" font-size="9" letter-spacing="1">STARS</text>
            <text x="146" y="140" class="mono icon-glow" fill="#f0883e" font-size="22" font-weight="bold">{stars}</text>
            <text x="146" y="152" class="mono" fill="#6e7681" font-size="9">earned</text>

            <rect x="16" y="164" width="230" height="60" rx="8" fill="#161b22" fill-opacity="0.65" stroke="url(#cardBorder)" stroke-width="1"/>
            <text x="28" y="182" class="mono" fill="#8b949e" font-size="9" letter-spacing="1">WIP</text>
            <circle cx="28" cy="199" r="4" fill="#f0883e" class="icon-glow"/>
            <text x="38" y="202" class="mono" fill="#f0883e" font-size="11" font-weight="bold">Argus</text>
            <text x="75" y="202" class="mono" fill="#6e7681" font-size="10"> — Multi-Agent AI</text>
            <text x="28" y="216" class="mono" fill="#6e7681" font-size="8.5">Hardware Debugging &amp; Root Cause Analysis</text>

            <rect x="260" y="16" width="270" height="208" rx="8" fill="#161b22" fill-opacity="0.65" stroke="url(#cardBorder)" stroke-width="1"/>
            <text x="272" y="36" class="mono" fill="#8b949e" font-size="9" letter-spacing="1">COMMIT ACTIVITY</text>
            <circle cx="400" cy="31" r="4" fill="#3fb950" class="icon-glow"/>
            <text x="408" y="35" class="mono" fill="#3fb950" font-size="9">{total} this year</text>
            <text x="268" y="88" class="mono" fill="#484f58" font-size="8">hi</text>
            <text x="268" y="128" class="mono" fill="#484f58" font-size="8">md</text>
            <text x="268" y="165" class="mono" fill="#484f58" font-size="8">lo</text>
            <line x1="284" y1="165" x2="516" y2="165" stroke="#21262d" stroke-width="0.8"/>
            
            <g class="icon-glow">
              {bar_els}
            </g>
            {lbl_els}
            
            <line x1="272" y1="192" x2="522" y2="192" stroke="#21262d" stroke-width="0.8"/>
            <text x="272" y="207" class="mono" fill="#6e7681" font-size="9">streak</text>
            <text x="312" y="207" class="mono" fill="#388bfd" font-size="9" font-weight="bold">{streak} days</text>
            <text x="356" y="207" class="mono" fill="#6e7681" font-size="9">total</text>
            <text x="388" y="207" class="mono" fill="#e6edf3" font-size="9" font-weight="bold">{total}</text>
            <text x="412" y="207" class="mono" fill="#6e7681" font-size="9">updated {updated}</text>

            <rect x="544" y="16" width="262" height="208" rx="8" fill="#161b22" fill-opacity="0.65" stroke="url(#cardBorder)" stroke-width="1"/>
            <text x="556" y="36" class="mono" fill="#8b949e" font-size="9" letter-spacing="1">TOP PROJECTS</text>
            <line x1="556" y1="44" x2="794" y2="44" stroke="#21262d" stroke-width="0.8"/>
            
            <g class="float1">
              <text x="564" y="66" class="mono icon-glow" fill="#f0883e" font-size="9">🔥</text>
            </g>
            <text x="580" y="64" class="mono" fill="#e6edf3" font-size="9.5" font-weight="bold">Prolepsis</text>
            <text x="580" y="75" class="mono" fill="#8b949e" font-size="8">ISA-agnostic, RTL-based predictive TMU</text>
            <text x="580" y="85" class="mono" fill="#8b949e" font-size="8">designed for multicore processors.</text>
            <circle cx="790" cy="63" r="3.5" fill="#3fb950" class="icon-glow"/>
            
            <line x1="556" y1="94" x2="794" y2="94" stroke="#21262d" stroke-width="0.5"/>
            <g class="float2">
              <text x="564" y="116" class="mono icon-glow" fill="#d2a8ff" font-size="9">🚀</text>
            </g>
            <text x="580" y="114" class="mono" fill="#e6edf3" font-size="9.5" font-weight="bold">MobileNet-Accelerator-RTL</text>
            <text x="580" y="125" class="mono" fill="#8b949e" font-size="8">🏆 DVCon India '26 Top 100 submission.</text>
            <text x="580" y="135" class="mono" fill="#8b949e" font-size="8">Verilog Systolic Array &amp; on-the-fly GAP.</text>
            <circle cx="790" cy="113" r="3.5" fill="#3fb950" class="icon-glow"/>
            
            <line x1="556" y1="144" x2="794" y2="144" stroke="#21262d" stroke-width="0.5"/>
            <g class="float3">
              <text x="564" y="166" class="mono icon-glow" fill="#388bfd" font-size="9">🔒</text>
            </g>
            <text x="580" y="164" class="mono" fill="#e6edf3" font-size="9.5" font-weight="bold">AES128-LowPower-Architecture</text>
            <text x="580" y="175" class="mono" fill="#8b949e" font-size="8">Hardware AES-128 cryptographic engine</text>
            <text x="580" y="185" class="mono" fill="#8b949e" font-size="8">optimized for low-power applications.</text>
            <circle cx="790" cy="163" r="3.5" fill="#3fb950" class="icon-glow"/>
            
            <line x1="556" y1="194" x2="794" y2="194" stroke="#21262d" stroke-width="0.5"/>
            <rect x="556" y="206" width="6" height="11" rx="1" fill="#388bfd" class="cur icon-glow"/>
            <text x="568" y="215" class="mono" fill="#8b949e" font-size="8.5">{repos_count} repos · SystemVerilog · Verilog · Python</text>
          </svg>"""

          with open("banner.svg", "w") as f:
            f.write(svg)
          print(f"Done — {total} contributions, {streak} day streak, {stars} stars")
          EOF

      - name: Commit updated banner.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banner.svg
          git diff --staged --quiet || git commit -m "chore: update banner.svg [skip ci]"
          git push
