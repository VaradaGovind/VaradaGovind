name: Generate Banner SVG

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub stats & generate banner.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: VaradaGovind
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, os, datetime

          token    = os.environ["GITHUB_TOKEN"]
          username = os.environ["USERNAME"]
          headers  = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          # ── User profile ────────────────────────────────────────
          req  = urllib.request.Request(f"https://api.github.com/users/{username}", headers=headers)
          user = json.loads(urllib.request.urlopen(req).read())
          repos_count = user.get("public_repos", 0)

          # ── Stars ───────────────────────────────────────────────
          req   = urllib.request.Request(f"https://api.github.com/users/{username}/repos?per_page=100", headers=headers)
          repos = json.loads(urllib.request.urlopen(req).read())
          stars = sum(r.get("stargazers_count", 0) for r in repos)

          # ── Contributions via GraphQL ───────────────────────────
          now   = datetime.datetime.utcnow()
          start = datetime.datetime(now.year, 1, 1).strftime("%Y-%m-%dT00:00:00Z")
          end   = now.strftime("%Y-%m-%dT23:59:59Z")
          query = json.dumps({"query": f"""
          {{
            user(login: "{username}") {{
              contributionsCollection(from: "{start}", to: "{end}") {{
                contributionCalendar {{
                  totalContributions
                  weeks {{
                    contributionDays {{
                      contributionCount
                      date
                    }}
                  }}
                }}
              }}
            }}
          }}
          """})
          
          gql_req  = urllib.request.Request("https://api.github.com/graphql",
              data=query.encode(), headers={**headers, "Content-Type": "application/json"})
          gql_data = json.loads(urllib.request.urlopen(gql_req).read())
          cal      = gql_data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          total    = cal["totalContributions"]

          # ── Monthly buckets ─────────────────────────────────────
          monthly = {}
          all_days = []
          for week in cal["weeks"]:
            for day in week["contributionDays"]:
              m = day["date"][:7]
              monthly[m] = monthly.get(m, 0) + day["contributionCount"]
              all_days.append((day["date"], day["contributionCount"]))

          sorted_months = sorted(monthly.keys())[-12:]
          counts  = [monthly.get(m, 0) for m in sorted_months]
          abbr    = {"01":"J","02":"F","03":"M","04":"A","05":"M","06":"J",
                     "07":"J","08":"A","09":"S","10":"O","11":"N","12":"D"}
          labels  = [abbr.get(m[5:], "?") for m in sorted_months]
          max_c   = max(counts) if max(counts) > 0 else 1
          BAR_H   = 78
          BASELINE= 172
          bar_x   = [302 + i * 19 for i in range(12)]

          # ── Streak ──────────────────────────────────────────────
          all_days.sort(reverse=True)
          streak = 0
          for _, c in all_days:
            if c > 0: streak += 1
            else: break

          # ── Build animation keyframes ───────────────────────────
          bar_anims = ""
          for i, cnt in enumerate(counts):
            h = max(4, int(cnt / max_c * BAR_H))
            y_end = BASELINE - h
            bar_anims += f"@keyframes grow{i+1}{{0%{{height:0;y:{BASELINE}}}100%{{height:{h};y:{y_end}}}}}\n"
            bar_anims += f".b{i+1}{{animation:grow{i+1} 0.9s cubic-bezier(0.34,1.56,0.64,1) {0.05+i*0.07:.2f}s both}}\n"

          # ── Build bar + label elements ──────────────────────────
          bar_els = ""
          lbl_els = ""
          for i, (cnt, lx, lbl) in enumerate(zip(counts, bar_x, labels)):
            h   = max(4, int(cnt / max_c * BAR_H))
            y   = BASELINE - h
            col = "url(#gg)" if i >= 6 else "url(#gb)"
            bar_els += f'<rect class="b{i+1}" x="{lx}" width="15" y="{y}" height="{h}" rx="3" fill="{col}"/>\n  '
            lbl_els += f'<text x="{lx+1}" y="185" class="lbl">{lbl}</text>\n  '

          updated = now.strftime("%d %b %Y")

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260">
  <defs>
    <style>
      @keyframes pulse{{0%,100%{{opacity:1}}50%{{opacity:0.2}}}}
      .cur{{animation:pulse 1.2s ease-in-out infinite}}
      .lbl{{font-family:'Courier New',Courier,monospace;font-size:8.5px;fill:#484f58;letter-spacing:0.5px}}
      .cap{{font-family:'Courier New',Courier,monospace;font-size:8px;fill:#6e7681;letter-spacing:1.5px}}
      .val{{font-family:'Courier New',Courier,monospace;font-size:11px;fill:#e6edf3;font-weight:bold}}
      .sub{{font-family:'Courier New',Courier,monospace;font-size:9px;fill:#6e7681}}
      .mono{{font-family:'Courier New',Courier,monospace}}
      {bar_anims}
    </style>
    <clipPath id="clip"><rect width="860" height="260" rx="16"/></clipPath>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#388bfd"/><stop offset="100%" stop-color="#1f6feb" stop-opacity="0.8"/></linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3fb950"/><stop offset="100%" stop-color="#238636" stop-opacity="0.8"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#388bfd"/><stop offset="100%" stop-color="#3fb950"/></linearGradient>
  </defs>
  <rect width="860" height="260" rx="16" fill="#0d1117"/>
  <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#161b22" stroke-width="0.4"/></pattern>
  <rect width="860" height="260" fill="url(#grid)" clip-path="url(#clip)" opacity="0.6"/>
  <rect x="0" y="0" width="3" height="260" fill="url(#accent)"/>
  
  <rect x="18" y="18" width="238" height="80" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="38" class="cap">ENGINEER</text>
  <text x="32" y="62" class="mono" fill="#e6edf3" font-size="20" font-weight="bold" letter-spacing="-0.3">Varada Govind</text>
  <text x="32" y="80" class="mono" fill="#388bfd" font-size="10" letter-spacing="0.3">@VaradaGovind · he/him</text>
  
  <rect x="18" y="108" width="114" height="66" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="126" class="cap">REPOS</text>
  <text x="32" y="154" class="mono" fill="#e6edf3" font-size="26" font-weight="bold">{repos_count}</text>
  <text x="32" y="168" class="sub">public</text>
  
  <rect x="142" y="108" width="114" height="66" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="156" y="126" class="cap">STARS</text>
  <text x="156" y="154" class="mono" fill="#f0883e" font-size="26" font-weight="bold">{stars}</text>
  <text x="156" y="168" class="sub">earned</text>
  
  <rect x="18" y="186" width="238" height="56" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="204" class="cap">CURRENTLY BUILDING</text>
  <circle cx="32" cy="222" r="4.5" fill="#f0883e" opacity="0.25"/>
  <circle cx="32" cy="222" r="2.5" fill="#f0883e"/>
  <text x="44" y="226" class="mono" fill="#f0883e" font-size="11" font-weight="bold">OrionRV</text>
  <text x="104" y="226" class="sub"> — 4-core RV32IM multicore SoC</text>
  <text x="32" y="237" class="sub" fill="#484f58">Verilog · in progress</text>
  
  <rect x="270" y="18" width="282" height="224" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="284" y="38" class="cap">COMMIT ACTIVITY</text>
  <circle cx="430" cy="33" r="4" fill="#3fb950"/>
  <text x="438" y="37" class="mono" fill="#3fb950" font-size="9" font-weight="bold">{total} this year</text>
  <line x1="300" y1="105" x2="536" y2="105" stroke="#1c2128" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="300" y1="138" x2="536" y2="138" stroke="#1c2128" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="300" y1="172" x2="536" y2="172" stroke="#21262d" stroke-width="0.8"/>
  <text x="284" y="108" class="lbl">hi</text>
  <text x="284" y="141" class="lbl">md</text>
  <text x="284" y="174" class="lbl">lo</text>
  {bar_els}
  {lbl_els}
  <line x1="284" y1="198" x2="536" y2="198" stroke="#21262d" stroke-width="0.8"/>
  <text x="284" y="213" class="sub">streak</text>
  <text x="324" y="213" class="mono" fill="#388bfd" font-size="10" font-weight="bold">{streak} days</text>
  <text x="392" y="213" class="sub">total</text>
  <text x="420" y="213" class="mono" fill="#e6edf3" font-size="10" font-weight="bold">{total}</text>
  <text x="284" y="230" class="sub" fill="#484f58">updated {updated}</text>
  
  <rect x="566" y="18" width="276" height="224" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="580" y="38" class="cap">TOP PROJECTS</text>
  
  <line x1="580" y1="46" x2="826" y2="46" stroke="#21262d" stroke-width="0.8"/>
  <rect x="580" y="56" width="28" height="28" rx="6" fill="#f0883e" opacity="0.12"/>
  <text x="587" y="75" class="mono" fill="#f0883e" font-size="13">&#x2B21;</text>
  <text x="616" y="68" class="val">OrionRV</text>
  <text x="616" y="80" class="sub">4-core RV32IM SoC</text>
  <circle cx="828" cy="69" r="4" fill="#f0883e"/>
  
  <line x1="580" y1="94" x2="826" y2="94" stroke="#1c2128" stroke-width="0.6"/>
  <rect x="580" y="102" width="28" height="28" rx="6" fill="#388bfd" opacity="0.12"/>
  <text x="585" y="121" class="mono" fill="#388bfd" font-size="14">&#x26A1;</text>
  <text x="616" y="114" class="val">rtl-riscv32</text>
  <text x="616" y="126" class="sub">single-cycle RV32I processor</text>
  <circle cx="828" cy="115" r="4" fill="#3fb950"/>
  
  <line x1="580" y1="140" x2="826" y2="140" stroke="#1c2128" stroke-width="0.6"/>
  <rect x="580" y="148" width="28" height="28" rx="6" fill="#d2a8ff" opacity="0.12"/>
  <text x="585" y="167" class="mono" fill="#d2a8ff" font-size="13">&#x2B1F;</text>
  <text x="616" y="160" class="val">CMOS-Std-Cell-Lib</text>
  <text x="616" y="172" class="sub">transistor-level primitives</text>
  <circle cx="828" cy="161" r="4" fill="#3fb950"/>
  
  <line x1="580" y1="186" x2="826" y2="186" stroke="#1c2128" stroke-width="0.6"/>
  <rect x="580" y="194" width="28" height="28" rx="6" fill="#7ee787" opacity="0.12"/>
  <text x="585" y="213" class="mono" fill="#7ee787" font-size="13">&#x21C4;</text>
  <text x="616" y="206" class="val">rtl-spi-controller</text>
  <text x="616" y="218" class="sub">full-duplex SPI master/slave</text>
  <circle cx="828" cy="207" r="4" fill="#3fb950"/>
  
  <line x1="580" y1="232" x2="826" y2="232" stroke="#21262d" stroke-width="0.8"/>
  <rect x="580" y="239" width="5" height="9" rx="1" fill="#388bfd" class="cur"/>
  <text x="590" y="247" class="sub" fill="#484f58">{repos_count} repos · Verilog · SystemVerilog · C++</text>
</svg>"""

          with open("banner.svg", "w") as f:
            f.write(svg)
          print(f"Done — {total} contributions, {streak} day streak, {stars} stars")
          PYEOF

      - name: Commit updated banner.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banner.svg
          git diff --staged --quiet || git commit -m "chore: update banner.svg [skip ci]"
          git push
